name: Bug report
description: Report a reproducible product problem. Do not report vulnerabilities here.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use the private reporting process in SECURITY.md."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without passwords, API keys, or real support data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Affected role
      options: [Admin, IT Support Agent, Regular User, Not role-specific]
    validations:
      required: true
