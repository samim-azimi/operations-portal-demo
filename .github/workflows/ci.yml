name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pip-audit
      - run: pytest
        working-directory: backend
      - run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: pnpm audit --audit-level high
        working-directory: frontend

  canva-export:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Temporary Canva export trigger') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect Canva share view
        env:
          CANVA_VIEW_URL: https://www.canva.com/d/QuFXvf1Xa4_CqMN
        run: |
          mkdir -p out
          cat > inspect.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}, deviceScaleFactor:1});
          const response = await page.goto(process.env.CANVA_VIEW_URL, {waitUntil:'domcontentloaded', timeout:120000});
          console.log('status', response?.status(), 'url', page.url());
          await page.waitForTimeout(20000);
          fs.writeFileSync('out/page.html', await page.content());
          fs.writeFileSync('out/title.txt', await page.title());
          fs.writeFileSync('out/url.txt', page.url());
          await page.screenshot({path:'out/page.png', fullPage:true});
          const stats = await page.evaluate(() => ({
            canvases:[...document.querySelectorAll('canvas')].map((e,i)=>({i,w:e.width,h:e.height,rect:{x:e.getBoundingClientRect().x,y:e.getBoundingClientRect().y,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height}})),
            images:[...document.querySelectorAll('img')].slice(0,200).map((e,i)=>({i,src:e.currentSrc||e.src,alt:e.alt,rect:{x:e.getBoundingClientRect().x,y:e.getBoundingClientRect().y,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height}})),
            buttons:[...document.querySelectorAll('button')].slice(0,200).map((e,i)=>({i,text:(e.innerText||e.getAttribute('aria-label')||'').trim(),aria:e.getAttribute('aria-label')})),
            bodyText:(document.body.innerText||'').slice(0,30000)
          }));
          fs.writeFileSync('out/stats.json', JSON.stringify(stats,null,2));
          await browser.close();
JS
          node inspect.mjs
      - name: Upload Canva inspection
        uses: actions/upload-artifact@v4
        with:
          name: canva-view-export-test
          path: out/
          retention-days: 1
